# Search for a film the demo household has: Sintel is the only result, and it shows as Ready to watch. Each flow is a
# new Maestro session, and its first tap is sometimes lost, so every tap that moves to another screen is repeated until
# that screen shows.
appId: com.rtc-services.jellypass
---
- repeat:
    while:
      notVisible:
        id: "search-field"
    times: 5
    commands:
      - tapOn:
          id: "tab-search"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "search-field"
- tapOn:
    id: "search-field"
- inputText: "Sintel"
# Search sends it, and the field gives up the keyboard.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Sintel.*Ready to watch"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
