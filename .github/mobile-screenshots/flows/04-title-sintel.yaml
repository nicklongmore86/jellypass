# Sintel's title page, from its search result: the household has it, so it shows Ready to watch and Play. Taps are
# repeated until they land (03-search.yaml).
appId: com.rtc-services.jellypass
---
- repeat:
    while:
      notVisible:
        id: "detail-facts"
    times: 5
    commands:
      - tapOn: "Sintel.*Ready to watch"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "detail-facts"
- assertVisible: "Ready to watch"
- assertVisible: "Play Sintel"
- waitForAnimationToEnd:
    timeout: 10000
