# A public-domain film the demo household doesn't have, so its page shows Available to request and the Request button.
# Search also lists the 2005 remake, so the 1920 film is chosen by its year. Nothing is pressed: the flow only opens the
# page. Taps are repeated until they land (03-search.yaml).
appId: com.rtc-services.jellypass
---
- repeat:
    while:
      notVisible:
        id: "search-field"
    times: 5
    commands:
      - tapOn:
          id: "tab-search"
      - waitForAnimationToEnd:
          timeout: 5000
- repeat:
    while:
      visible: "Back"
    times: 5
    commands:
      - tapOn: "Back"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "search-field"
- tapOn:
    id: "search-field"
# The field still holds the last search.
- eraseText: 20
- inputText: "Caligari"
- pressKey: Enter
- extendedWaitUntil:
    visible: "The Cabinet of Dr\\. Caligari, 1920.*Available to request"
    timeout: 30000
- repeat:
    while:
      notVisible:
        id: "detail-facts"
    times: 5
    commands:
      - tapOn: "The Cabinet of Dr\\. Caligari, 1920.*Available to request"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "detail-facts"
- assertVisible: "Available to request"
- assertVisible: "Request: The Cabinet of Dr\\. Caligari"
- waitForAnimationToEnd:
    timeout: 10000
