appId: com.rtc-services.jellypass
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Connect to your household"
    timeout: 120000
- tapOn:
    text: "Household address"
    index: 1
- inputText: "${ADDRESS}"
- tapOn: "Connect to your household"
- assertVisible: "${ADDRESS}"
