appId: com.rtc-services.jellypass
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Connect to your household"
    timeout: 120000
# The label's Text comes first in the tree; the field with the same name comes second.
- tapOn:
    text: "Household address"
    index: 1
- inputText: "${ADDRESS}"
# A tap outside the field dismisses the keyboard; hideKeyboard is unreliable on iPhone.
- tapOn: "Connect to your household"
- assertVisible: "${ADDRESS}"
