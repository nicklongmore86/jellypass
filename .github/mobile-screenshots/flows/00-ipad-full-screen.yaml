# iPad only, before the app: iPadOS 26 opens apps in resizable windows by default, which draws a resize grip in the
# screenshots' corner. Settings → Multitasking & Gestures → Full Screen Apps opens them full screen, as most iPads are.
appId: com.apple.Preferences
---
- launchApp:
    stopApp: true
- scrollUntilVisible:
    element: "Multitasking & Gestures"
    direction: DOWN
    timeout: 30000
- tapOn: "Multitasking & Gestures"
# The tap has been lost before (a run's images all had the grip), so it is repeated until the option shows as chosen;
# choosing it again changes nothing. Settings is given a moment to keep it before it is closed.
- repeat:
    while:
      notVisible:
        text: "Full Screen Apps"
        selected: true
    times: 3
    commands:
      - tapOn: "Full Screen Apps"
      - waitForAnimationToEnd:
          timeout: 5000
# Required: if every tap was lost, the iPad step fails here instead of taking images with the grip. (Run 43129435505
# showed iOS exposes the state: the loop tapped once, then saw the option selected.)
- assertVisible:
    text: "Full Screen Apps"
    selected: true
- waitForAnimationToEnd:
    timeout: 5000
- stopApp
