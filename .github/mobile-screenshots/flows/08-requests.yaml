# Back out of the collection and film pages, then the demo member's own requests: public-domain films the library
# doesn't have. Taps are repeated until they land (03-search.yaml).
appId: com.rtc-services.jellypass
---
- repeat:
    while:
      visible: "Back"
    times: 5
    commands:
      - tapOn: "Back"
      - waitForAnimationToEnd:
          timeout: 5000
- repeat:
    while:
      notVisible:
        id: "request-list"
    times: 5
    commands:
      - tapOn:
          id: "tab-requests"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: "The General.*"
    timeout: 30000
# Captured unscrolled, so the filters stay in view under the header. On iPhone the last sample may sit behind the tab
# bar, as any list does.
- waitForAnimationToEnd:
    timeout: 10000
