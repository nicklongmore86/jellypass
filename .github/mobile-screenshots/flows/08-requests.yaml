# Back out of the collection and film pages, then the demo member's own requests: public-domain films the library
# doesn't have. Taps are repeated until they land (03-search.yaml).
appId: com.rtc-services.jellypass
---
- repeat:
    while:
      visible: "Back"
    times: 5
    commands:
      - tapOn: "Back"
      - waitForAnimationToEnd:
          timeout: 5000
- repeat:
    while:
      notVisible:
        id: "request-list"
    times: 5
    commands:
      - tapOn:
          id: "tab-requests"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: "The General.*"
    timeout: 30000
# On iPhone the filters push the third sample behind the tab bar; scrolling to the end shows all three. On iPad they
# already fit, so this does nothing.
- scroll
- scroll
- assertVisible: "Sherlock Jr.*"
- waitForAnimationToEnd:
    timeout: 10000
