name: Mobile release

# Release builds of the household app (mobile/) on EAS Build: iOS to TestFlight, Android as a sideloaded APK.
# The builds run on EAS's own machines (macOS for iOS), so this only needs an Ubuntu runner to start them and wait.
# It never runs on a pull request: only by hand (Actions → Mobile release → Run workflow) or from a `mobile-v*` tag.
# One-time setup, the secrets and how members install: mobile/README.md, "Release builds".
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: Build profile (mobile/eas.json)
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Send the iOS build to TestFlight
        type: boolean
        default: true
  push:
    tags: ['mobile-v*']
  # TestFlight builds expire 90 days after upload. To keep one current without remembering, uncomment this: it builds
  # with the tag defaults below (both apps, production, submitted to TestFlight) at 06:00 UTC on the 1st of each
  # month, and waits for the `mobile-release` reviewer like any other run. Each run is one iOS and one Android build
  # against the EAS plan's monthly allowance.
  # schedule:
  #   - cron: '0 6 1 * *'

permissions:
  contents: read

# Never two releases of the same ref at once: the remote build numbers and TestFlight would race.
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (the tag each was at, in the comment), so a moved tag can't change what runs.

jobs:
  # The same checks as mobile.yaml, with no secrets in reach, before anyone is asked to approve a build.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      # A tag builds the version it names, or nothing: `mobile-v<version>` must be `version` in mobile/package.json
      # (which app.config.ts reads) and mobile/CHANGELOG.md must have notes for it (mobile/README.md, "Versioning").
      # The tag reaches the script as GITHUB_REF_NAME, never spliced into the command. Only on a tag push (the push
      # trigger takes nothing else), the same gate as the release job: a run by hand is a test build of any ref, even a
      # `mobile-v*` tag, so it isn't held to the tag's version and publishes nothing.
      - name: Check the tag matches the app's version and changelog
        if: github.event_name == 'push'
        run: node ../scripts/mobile-release-tag.mjs "$GITHUB_REF_NAME" package.json CHANGELOG.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check the EAS project ID is committed
        run: |
          project_id="$(pnpm exec expo config --type public --json | jq -r '.extra.eas.projectId // empty')"
          if [ -z "$project_id" ]; then
            echo "::error file=mobile/app.config.ts::mobile/app.config.ts has no extra.eas.projectId (mobile/README.md, Release builds)."
            exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-24.04
    # The secrets live in this environment, and its required reviewer approves every run before this job starts.
    environment: mobile-release
    # EAS's free plan queues builds at low priority; a release waits for both builds and the TestFlight upload.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mobile
    env:
      # A tag (or the commented-out schedule) has no inputs: build both apps for production and send iOS to TestFlight.
      PLATFORM: ${{ inputs.platform || 'all' }}
      PROFILE: ${{ inputs.profile || 'production' }}
      SUBMIT: ${{ github.event_name != 'workflow_dispatch' || inputs.submit }}
      # Pinned like the actions; eas.json's cli.version is the floor.
      EAS_CLI_VERSION: 24.12.1
      # No usage telemetry from either CLI.
      EXPO_NO_TELEMETRY: 1
      DISABLE_EAS_ANALYTICS: 1
      # The Apple Developer membership type. Not secret: set the APPLE_TEAM_TYPE variable on the environment to
      # COMPANY_OR_ORGANIZATION if the membership is an organisation's.
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      # The app's numeric Apple ID in App Store Connect (App Information → Apple ID). Not secret; `eas submit` needs
      # it to run non-interactively. An environment variable, ASC_APP_ID, on `mobile-release`.
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      # EAS CLI reads app.config.ts, which needs `expo` installed.
      - run: pnpm install --frozen-lockfile
      - run: npm install --global "eas-cli@${EAS_CLI_VERSION}"

      # Signs in and looks up the project before a build is spent, so a bad token or a missing role fails here with a
      # readable message instead of a bare "GraphQL request failed." from the build. `eas whoami` lists the token's
      # account and its role in each organization; its email line is kept out of the (public) log. EAS CLI's output is
      # printed between ::stop-commands:: and a random marker, so text in it can't act as a workflow command (::error::,
      # ::add-mask::, ...); this step's own ::error:: lines come after. Troubleshooting: mobile/README.md, "When a
      # release fails".
      - name: Check the Expo token can build the project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          causes="Likely cause: the EXPO_TOKEN secret on the mobile-release environment is missing, revoked or mistyped; or the token's account has no build-capable role (Owner, Admin, Release Manager or Developer) in the rtc-services-llc Expo organization, which owns the project. See mobile/README.md, When a release fails."
          print_eas_output() {
            local marker
            marker="$(openssl rand -hex 16)"
            echo "::stop-commands::${marker}"
            printf '%s\n' "$1"
            echo "::${marker}::"
          }
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is empty. ${causes}"
            exit 1
          fi
          if ! whoami="$(eas whoami 2>&1)"; then
            print_eas_output "$(printf '%s\n' "$whoami" | sed '/@/d')"
            echo "::error::Expo refused EXPO_TOKEN (eas whoami failed). ${causes}"
            exit 1
          fi
          print_eas_output "$(printf '%s\n' "$whoami" | sed '/@/d')"
          # The first match only, with sed quitting rather than a pipe into head, which pipefail would turn into a
          # failure.
          role="$(printf '%s\n' "$whoami" | sed -n 's/.* rtc-services-llc (Role: \([^)]*\)).*/\1/p;T;q')"
          # The labels `eas whoami` prints at 24.12.1 (commands/account/view.js). Anything else (Viewer, Custom, or a
          # role added after this CLI version) is refused rather than guessed at.
          case "$role" in
            Owner | Admin | Developer | 'Release Manager') ;;
            '')
              echo "::error::The EXPO_TOKEN account is not a member of the rtc-services-llc Expo organization. ${causes}"
              exit 1
              ;;
            *)
              echo "::error::The EXPO_TOKEN account's role in rtc-services-llc is ${role}, not one that can start builds. ${causes}"
              exit 1
              ;;
          esac
          if ! info="$(eas project:info 2>&1)"; then
            print_eas_output "$info"
            echo "::error::Signed in as a member of rtc-services-llc (Role: ${role}), but the project in app.config.ts could not be read (eas project:info failed). ${causes}"
            exit 1
          fi
          print_eas_output "$info"

      - name: Check the TestFlight settings before spending a build
        if: env.PLATFORM != 'android' && env.SUBMIT == 'true'
        run: |
          if ! printf '%s' "$ASC_APP_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::Set the ASC_APP_ID variable on the mobile-release environment to the app's Apple ID from App Store Connect (digits only)."
            exit 1
          fi

      # The App Store Connect API key, for EAS to make the iOS provisioning profile and for the TestFlight upload. It
      # is written readable only by the runner's user, outside the checkout, and deleted in the last step.
      - name: Write the App Store Connect API key
        if: env.PLATFORM != 'android'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key_path="${RUNNER_TEMP}/asc-api-key.p8"
          (umask 077 && printf '%s\n' "$ASC_API_KEY_P8" > "$key_path")
          chmod 600 "$key_path"
          echo "EXPO_ASC_API_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Apple's credentials only when iOS is being built.
          EXPO_ASC_KEY_ID: ${{ env.PLATFORM != 'android' && secrets.ASC_API_KEY_ID || '' }}
          EXPO_ASC_ISSUER_ID: ${{ env.PLATFORM != 'android' && secrets.ASC_API_ISSUER_ID || '' }}
          EXPO_APPLE_TEAM_ID: ${{ env.PLATFORM != 'android' && secrets.APPLE_TEAM_ID || '' }}
        # --json prints the finished builds to stdout (the logs go to stderr, which stays in this log); --wait is the
        # default, spelled out. When EAS CLI fails, its error can land on stdout instead (run 40404852233 logged only
        # "GraphQL request failed."), so on failure its messages (or the file's start, if it isn't JSON) are shown
        # here. Build records have no credential fields; an error message can name a file, such as the API key's path,
        # but EAS CLI doesn't put the key or the token in one. EXPO_DEBUG stays off: it dumps whole error objects,
        # request context included. Everything EAS CLI prints is between ::stop-commands:: and a random marker, so it
        # can't act as a workflow command; the ::error:: line comes after.
        run: |
          builds="${RUNNER_TEMP}/builds.json"
          marker="$(openssl rand -hex 16)"
          echo "::stop-commands::${marker}"
          status=0
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --wait --json > "$builds" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "EAS CLI exited with ${status}. What it wrote to stdout:"
            # Cut to 4000 characters without piping into head, which would end the writer with SIGPIPE.
            messages="$(jq -r '[.. | objects | .message? | strings] | unique | join("\n") | .[0:4000]' "$builds" 2> /dev/null || true)"
            if [ -z "$messages" ]; then
              messages="$(head -c 4000 "$builds")"
            fi
            printf '%s\n' "$messages"
          fi
          echo "::${marker}::"
          if [ "$status" -ne 0 ]; then
            echo "::error::EAS CLI exited with ${status}. Its messages are printed above."
            exit "$status"
          fi

      - name: Report the builds
        run: |
          builds="${RUNNER_TEMP}/builds.json"
          if ! jq -e 'type == "array"' "$builds" > /dev/null 2>&1; then
            marker="$(openssl rand -hex 16)"
            echo "::stop-commands::${marker}"
            head -c 4000 "$builds"
            echo
            echo "::${marker}::"
            echo "::error::EAS CLI finished but builds.json is not the list of builds it should be. Its start is printed above."
            exit 1
          fi
          {
            echo "## JellyPass ${PROFILE} builds"
            echo
            jq -r '.[] | "- **\(.platform)** \(.appVersion // "?") (\(.appBuildVersion // "?")): \(.status), [build page](https://expo.dev/accounts/rtc-services-llc/projects/jellypass/builds/\(.id))"' "$builds"
            jq -r '.[] | select(.platform == "ANDROID" and .artifacts.buildUrl != null) | "\n**Android APK:** \(.artifacts.buildUrl)\n\nShare this link with members (mobile/README.md, \"Install on Android\")."' "$builds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send the iOS build to TestFlight
        if: env.PLATFORM != 'android' && env.SUBMIT == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          build_id="$(jq -r '.[] | select(.platform == "IOS") | .id' "${RUNNER_TEMP}/builds.json")"
          # ascAppId is not secret but differs per Apple account, so it comes from the environment, not the repo.
          jq --arg id "$ASC_APP_ID" '.submit.production.ios.ascAppId = $id' eas.json > "${RUNNER_TEMP}/eas.json"
          mv "${RUNNER_TEMP}/eas.json" eas.json
          marker="$(openssl rand -hex 16)"
          echo "::stop-commands::${marker}"
          status=0
          eas submit --platform ios --profile production --id "$build_id" --non-interactive --wait || status=$?
          echo "::${marker}::"
          if [ "$status" -ne 0 ]; then
            echo "::error::EAS CLI exited with ${status} sending the build to TestFlight. Its messages are printed above."
            exit "$status"
          fi
          echo "- **IOS** sent to TestFlight. Internal testers get it once App Store Connect finishes processing (usually under an hour)." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the App Store Connect API key
        if: always()
        run: rm -f "${RUNNER_TEMP}/asc-api-key.p8"

  # A pushed tag's builds, once done, get a GitHub release with the version's notes from mobile/CHANGELOG.md (the same
  # script as the server's release notes, given the app's changelog). Never marked Latest, so the repository's latest
  # release stays the server's. Only a tag push publishes: a run by hand is a test build and publishes nothing, even
  # when started on a `mobile-v*` tag (its inputs may pick the preview profile or one app). Re-running a tag push's run
  # keeps its push event, so it still publishes. No secrets: only this job's own token. GitHub has no releases-only
  # permission, so `contents: write` also lets it push commits and tags; this job only runs `gh release`.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Extract release notes from mobile/CHANGELOG.md
        run: |
          version="$(node scripts/mobile-release-tag.mjs "$GITHUB_REF_NAME")"
          node scripts/changelog-section.mjs "$version" mobile/CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="JellyPass app ${VERSION}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "${RUNNER_TEMP}/release-notes.md" --latest=false
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file "${RUNNER_TEMP}/release-notes.md" --latest=false
          fi
