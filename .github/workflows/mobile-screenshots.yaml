name: Mobile screenshots

# App Store screenshots use a Release simulator build and a configured demo household.
# Devices: iPhone 6.9" (1320x2868) and iPad 13" (2064x2752), both portrait.
# The screenshots artifact contains the six numbered App Store images for each device.
# Store image 06-sign-in shows the address screen and may reveal the configured address.
# Never upload Maestro debug output: commands and view trees can contain expanded secrets.
# Set MOBILE_SCREENSHOT_ADDRESS and MOBILE_SCREENSHOT_PROFILE repository secrets.
#
# Run by hand (Actions → Mobile screenshots → Run workflow) on any ref, or push a `screenshots/**` branch to take them
# from a release branch before it is merged.
on:
  workflow_dispatch:
  push:
    branches: ['screenshots/**']

permissions:
  contents: read

concurrency:
  group: mobile-screenshots-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag each was at, in the comment), so a moved tag can't change what runs.

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      ADDRESS: ${{ secrets.MOBILE_SCREENSHOT_ADDRESS }}
      PROFILE: ${{ secrets.MOBILE_SCREENSHOT_PROFILE }}
      EXPO_NO_TELEMETRY: 1
      # Maestro's install script reads this; pinned like the actions.
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      # Maestro's XCTest driver is built and started on each fresh simulator, which on a hosted runner takes longer
      # than its default allowance (milliseconds).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 900000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Require screenshot configuration
        run: |
          missing=0
          if [ -z "$ADDRESS" ]; then
            echo "::error::Missing MOBILE_SCREENSHOT_ADDRESS repository secret"
            missing=1
          fi
          if [ -z "$PROFILE" ]; then
            echo "::error::Missing MOBILE_SCREENSHOT_PROFILE repository secret"
            missing=1
          fi
          exit "$missing"
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      # The native project, generated from app.config.ts as EAS does, and built for the simulator in the Release
      # configuration: the JavaScript bundled into the app, no dev server and no dev menu. It is signed ad hoc ("Sign to
      # Run Locally", no Apple team or certificate): unsigned, it would have no entitlements, and the Keychain, where
      # the app keeps its sign-in, refuses an app without them.
      - run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios
      - name: Build the app for the simulator (Release)
        id: build
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace JellyPass.xcworkspace -scheme JellyPass -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO build | tail -n 200
          app="$(pwd)/build/Build/Products/Release-iphonesimulator/JellyPass.app"
          test -d "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The iPhone with Apple's largest (6.9") screen, then the 13" iPad, newest model first.
      - name: iPhone 6.9"
        run: .github/mobile-screenshots/take.sh "$APP" screenshots/iphone-6.9 1320x2868 'iPhone 17 Pro Max' 'iPhone 16 Pro Max'
      # Taken even when the iPhone's fail, so one run shows what is wrong with both.
      - name: iPad 13"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/mobile-screenshots/take.sh "$APP" screenshots/ipad-13 2064x2752 'iPad Pro 13-inch (M5)' 'iPad Pro 13-inch (M4)'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/*/0[1-6]-*.png
          retention-days: 3
          if-no-files-found: error
