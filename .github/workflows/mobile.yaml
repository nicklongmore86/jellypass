name: Mobile

# The household app for iPhone, iPad and Android (mobile/). It has its own
# package.json and lockfile and is not part of the server's build or image, so
# it runs only when mobile/ changes, the PWA files its tests read (app/src for
# its wording, app/static for the stylesheet its theme is ported from and the
# TMDB logo), the API contract its client is tested against (docs/app-api), or
# the release workflow (mobile/__tests__/eas-json.test.ts checks it).
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app/src/**'
      - 'app/static/**'
      - 'docs/app-api/**'
      - '.github/workflows/mobile.yaml'
      - '.github/workflows/mobile-release.yaml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/src/**'
      - 'app/static/**'
      - 'docs/app-api/**'
      - '.github/workflows/mobile.yaml'
      - '.github/workflows/mobile-release.yaml'

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag each was at, in the comment), so a moved tag can't change what runs.

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      # Expo's CLI sends usage telemetry unless told not to.
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
