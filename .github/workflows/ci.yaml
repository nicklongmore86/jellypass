name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: docker build .

  jellyfin-integration:
    strategy:
      matrix:
        image: ['jellyfin/jellyfin:10.11.11', 'jellyfin/jellyfin:12.4.20261026-211555']
    env:
      JELLYFIN_IMAGE: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starts a throwaway supported Jellyfin container, runs
      # test/real-jellyfin.test.mjs against it, and prints its logs on failure.
      - run: pnpm test:real

  seerr-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starts a throwaway ghcr.io/seerr-team/seerr:v3.5.1 container, runs
      # test/real-seerr.test.mjs against it, and prints its logs on failure.
      - run: pnpm test:seerr
