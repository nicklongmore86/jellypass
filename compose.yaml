services:
  jellypass:
    image: ${JELLYPASS_IMAGE:-ghcr.io/nicklongmore86/jellypass:latest}
    restart: unless-stopped
    # Optional: without it (or without the required settings in it), JellyPass starts its setup wizard.
    env_file:
      - path: ${JELLYPASS_ENV_FILE:-.env}
        required: false
    environment:
      STATE_FILE: /app/data/grants.json
      # Member listener: household addresses only. Point the reverse proxy's household hosts here.
      HOST: 0.0.0.0
      PORT: 8787
      # Admin listener: admin site and API, /metrics, the Seerr webhook and /health. Never route a public host here.
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8788
    volumes:
      - ./data:/app/data
    ports:
      - 127.0.0.1:8787:8787
      # Published to this machine only. To reach the admin site from your LAN, publish it on a private address
      # instead (for example 192.168.1.10:8788:8788), never on a public one.
      - 127.0.0.1:8788:8788
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
