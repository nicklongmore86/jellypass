services:
  jellypass:
    image: ${JELLYPASS_IMAGE:-ghcr.io/nicklongmore86/jellypass:latest}
    restart: unless-stopped
    env_file:
      - ${JELLYPASS_ENV_FILE:-.env}
    environment:
      STATE_FILE: /app/data/grants.json
      HOST: 0.0.0.0
      PORT: 8787
    volumes:
      - ./data:/app/data
    ports:
      - 127.0.0.1:8787:8787
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
