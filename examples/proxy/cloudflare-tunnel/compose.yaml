# JellyPass + Cloudflare Tunnel (cloudflared). Setup and checks: docs/reverse-proxy.md#cloudflare-tunnel
#
#   cp env.example .env                     # the tunnel token
#   cp ../../../.env.example jellypass.env  # optional: JellyPass settings (otherwise the setup wizard)
#   mkdir -m 700 data && sudo chown 1000:1000 data
#   docker compose up -d
#
# In the tunnel's Public Hostnames, add one per household address, each with service type HTTP and URL
# jellypass:8787 (leave "HTTP Host Header" empty, so the household's own name reaches JellyPass). Never add a
# public hostname for jellypass:8788 unless a Cloudflare Access application protects it.
# Locally-managed tunnel instead of a token: see config.yml in this directory.
services:
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    networks:
      proxy:
        # A fixed address, so TRUSTED_PROXIES can name exactly this container.
        ipv4_address: 172.30.88.10

  jellypass:
    image: ${JELLYPASS_IMAGE:-ghcr.io/nicklongmore86/jellypass:latest}
    restart: unless-stopped
    env_file:
      - path: ${JELLYPASS_ENV_FILE:-jellypass.env}
        required: false
    environment:
      STATE_FILE: /app/data/grants.json
      HOST: 0.0.0.0
      PORT: 8787
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8788
      HOUSEHOLD_GATEWAY_ENABLED: "true"
      # cloudflared's address above, and nothing else. Cloudflare's edge writes the client's address into
      # X-Forwarded-For and cloudflared passes it on, so no Cloudflare ranges are needed here.
      TRUSTED_PROXIES: 172.30.88.10
    volumes:
      - ./data:/app/data
    ports:
      # The member listener (8787) is not published: only cloudflared reaches it.
      # The admin listener on this machine only. For your LAN, use a private address instead (for example
      # 192.168.1.10:8788:8788), never a public one.
      - 127.0.0.1:8788:8788
    networks:
      - proxy
      # JELLYFIN_URL must be reachable from this container. If Jellyfin runs in another Compose project, join its
      # network here (and declare it under networks: as external: true), or use an address on your LAN.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    ipam:
      config:
        # Change it if Docker reports the pool overlaps another network; change ipv4_address and TRUSTED_PROXIES too.
        - subnet: 172.30.88.0/24
