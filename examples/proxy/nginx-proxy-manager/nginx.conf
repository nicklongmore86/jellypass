# The same proxy in plain nginx (or SWAG, or anything that takes an nginx server block), for reference.
# Put the map in the http context once; the server block per household address, or one block listing them all.
# nginx looks `jellypass` up when it starts and stops with `host not found in upstream "jellypass"` if it cannot:
# start it after JellyPass (depends_on in the same Compose project) or on a network where the name resolves.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    # Every household address served here must also be mapped to its household in JellyPass.
    server_name grove.example.com heath.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        # The member listener, never the admin one (8788).
        proxy_pass http://jellypass:8787;
        proxy_http_version 1.1;

        # The household is chosen from Host. $host has no port: if this server listens on a port other than 443 and
        # the household's address carries that port (https://media.example.com:8443), use $http_host instead.
        proxy_set_header Host $host;
        # Appends the client's address; JellyPass walks the list from the right and stops at it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/socket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream media and uploads instead of buffering them to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
