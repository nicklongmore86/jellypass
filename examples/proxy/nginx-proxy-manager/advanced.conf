# Nginx Proxy Manager: paste into each household proxy host's "Advanced" tab (Custom Nginx Configuration).
#
# The proxy host itself (Details tab):
#   Domain Names:          grove.example.com   (one household address; one proxy host per household, or several
#                                               addresses of the same JellyPass on one host — each must be mapped)
#   Scheme / Forward Host / Port:  http / jellypass / 8787   (the member listener, never 8788)
#   Websockets Support:    on   (Jellyfin's /socket)
#   Cache Assets:          off
#   Block Common Exploits: optional
# SSL tab: a Let's Encrypt certificate (DNS challenge, if the host is not reachable on port 80), Force SSL on.
#
# NPM already sends what JellyPass needs from every proxy host: `Host $host`, X-Forwarded-For appended with the
# client's address ($proxy_add_x_forwarded_for), X-Forwarded-Proto $scheme, and the Upgrade/Connection headers with
# Websockets Support on. Do not add a `location /` here: it would replace NPM's own, and those headers with it.
#
# Stream media and uploads instead of buffering them to disk:
proxy_buffering off;
proxy_request_buffering off;
